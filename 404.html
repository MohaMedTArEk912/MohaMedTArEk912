<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f6f1e6" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>404 — Page Not Found | Mohamed Tarek Hussien</title>
    <style>
      :root {
        --ink: #211f1b;
        --red: #a92c22;
        --gold: #efc45f;
        --sheet: #f6f1e6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(rgba(87, 67, 32, 0.16) 1px, transparent 1px) 0 0 / 8px 8px,
          var(--sheet);
        color: var(--ink);
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .card {
        width: min(560px, 100%);
        background: #fffbf2;
        border: 3px solid var(--ink);
        box-shadow: 7px 7px 0 var(--ink);
        padding: clamp(1.5rem, 4vw, 2.5rem);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--gold);
        border: 2px solid var(--ink);
        padding: 0.2rem 0.65rem;
        font: 700 0.78rem/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em;
        transform: rotate(-1.5deg);
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font: 900 clamp(2.4rem, 7vw, 3.6rem)/0.98 Impact, 'Arial Narrow', system-ui, sans-serif;
        letter-spacing: 0.02em;
      }
      h1 span { color: var(--red); }
      p {
        margin: 0 0 1.5rem;
        color: #4c463d;
        max-width: 46ch;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.7rem 1.05rem;
        border: 2px solid var(--ink);
        background: #fff9ec;
        color: var(--ink);
        text-decoration: none;
        font-weight: 700;
        font-size: 0.92rem;
        box-shadow: 3px 3px 0 var(--ink);
        transition: transform 0.16s ease;
      }
      a.primary {
        background: var(--red);
        color: #fffaf0;
      }
      a:hover { transform: translateY(-2px); }
      a:focus-visible { outline: 3px solid #19707a; outline-offset: 4px; }
      footer {
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid #c2b8a4;
        font-size: 0.82rem;
        color: #5d564b;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Issue #404 · Missing panel</span>
      <h1>Page <span>not found</span></h1>
      <p>
        This route doesn't exist in <strong>The Architect Chronicles</strong>.
        Head back to Mohamed Tarek Hussien's portfolio or jump straight into the interactive comic.
      </p>
      <div class="actions">
        <a class="primary" href="%BASE_URL%">Return to portfolio</a>
        <a href="%BASE_URL%comic/">Open interactive comic</a>
        <a href="%BASE_URL%resume/">View résumé</a>
      </div>
      <footer>Mohamed Tarek Hussien · Full-Stack Software Engineer</footer>
    </main>
  </body>
</html>
