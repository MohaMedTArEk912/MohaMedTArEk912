    <!-- Procedural SVG Vintage Paper Grain & Hand-Inked Border Filter -->
    <svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
      <defs>
        <filter id="pulp-ink-filter" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="pulp-paper-grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" result="grain" />
          <feColorMatrix type="saturate" values="0" in="grain" result="bwGrain" />
          <feBlend mode="multiply" in="SourceGraphic" in2="bwGrain" />
        </filter>
      </defs>
    </svg>
    <style>
      .archive-boot { position:fixed; inset:0; display:grid; place-content:center; gap:1rem; padding:1.25rem; background:radial-gradient(ellipse at 45% 35%,#5b3730,#211917 73%); color:#f7e8d0; font:1rem/1.4 system-ui,sans-serif; }
      .archive-boot strong { font: bold clamp(2rem,6vw,3.6rem)/1 Georgia,serif; }
      .archive-boot a { position:absolute; top:1rem; left:1rem; justify-self:start; padding:.5rem .75rem; border:1px solid #cfad7a; color:inherit; }
      .archive-emblem { width:3.25rem; height:4.25rem; border:1px solid #d0ac76; border-left:5px double #e2c190; background:#773a32; box-shadow:3px 3px #30201b,4px 4px #cead80; transform:rotate(-6deg); }
      .archive-rule { height:2px; background:#d6b482; transform-origin:left; }
      @media(prefers-reduced-motion:no-preference) {
        .archive-rule { animation:archive-ink 1.3s cubic-bezier(.18,.65,.3,1) both; }
        .archive-emblem { animation:archive-stamp .65s ease-out both; }
        .archive-boot.departing > :not(a) { animation:archive-depart .32s ease-in both; }
      }
      @keyframes archive-ink { from {transform:scaleX(0)} to {transform:scaleX(1)} }
      @keyframes archive-stamp { from {opacity:0;transform:translateY(10px) rotate(-13deg)} }
      @keyframes archive-depart { to {opacity:0;translate:0 -7px} }
    </style>

    <template id="archive-boot">
      <main class="archive-boot"><i class="archive-emblem" aria-hidden="true"></i><strong>The Architect Chronicles</strong>
        <i class="archive-rule" aria-hidden="true"></i><span role="status" data-boot-status>Loading comic…</span><a href="%BASE_URL%">← Return to landing</a>
      </main>
    </template>
    <script>
      const entryParams = new URLSearchParams(location.search);
      const comicPath = '%BASE_URL%comic/';
      const isComicPath = [comicPath, comicPath.slice(0, -1), comicPath + 'index.html'].includes(location.pathname);
      const edition = entryParams.get('edition');
      if (isComicPath || edition === 'archive' || edition === 'comic') {
        if (!isComicPath) {
          const comicUrl = new URL(comicPath, location.href);
          entryParams.delete('edition');
          comicUrl.search = entryParams.toString();
          comicUrl.hash = location.hash;
          history.replaceState(history.state, '', comicUrl);
        }
        performance.mark('comic-intro-start');
        const root = document.getElementById('root');
        root.dataset.edition = 'comic';
        root.append(document.getElementById('archive-boot').content.cloneNode(true));
        const volume = Number(entryParams.get('volume'));
        if (entryParams.get('view') !== 'stage' && (volume === 0 || volume === 1)) {
          const image = document.createElement('link');
          image.rel = 'preload'; image.as = 'image'; image.fetchPriority = 'high';
          image.href = volume === 1 ? '%BASE_URL%comic/forge.webp' : '%BASE_URL%comic/architect-cover.webp';
          document.head.append(image);
        }
      }
    </script>
